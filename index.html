<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="dir/script.js" defer></script>
    <script src="dir/signup.js" defer></script>
    <title>META Browser</title>

</head>

<body>
    <header>
        <div class="content__container">
            <img class="content__img" src="./META.png" alt="META Image">
            <span class="content__title">META</span>
        </div>
        <nav class="settings">
            <button class="nav-btn" id="menu-btn" type="button">MENU</button>
            <button class="nav-btn" id="login-btn" type="button">LOGIN</button>
        </nav>

        <dialog id="menu-dialog">
            <div class="menu-header">
                <span class="menu-title">MENU</span>
                <button id="close-menu-btn" type="button">✖</button>
            </div>
            <nav class="menu-list">
                <a href="#Profile">Profile</a>
                <a href="#Application">Application</a>
                <a href="#Stock">Stock</a>
                <a href="#Production">Production</a>
            </nav>
        </dialog>

        <dialog id="login-modal">
            <button id="close-login" type="button">✖</button>
            <h2>Welcome Back</h2>

            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in to your account</button>
                <span>Don't have an account? <a href="signup.html" target="_blank">Sign up</a></span>
            </form>

        </dialog>


    </header>

    <main>
        <section class="Profile" id="Profile">
            <div class="ViewProfile">
                <div class="ViewProfile__content">
                    <img src="mark1.jpg" alt="M1">
                    <img src="mark2.png" alt="M2">
                    <img src="mark3.jpg" alt="M3">
                </div>
            </div>
            <p></p>
            <div class="ViewProfile__controls">
                <button class="prev" type="button" aria-label="รูปก่อนหน้า">&lt;</button>
                <span class="Face">
                    <span class="ProfileDots"></span>
                    <span class="ProfileDots"></span>
                    <span class="ProfileDots"></span>
                </span>
                <button class="next" type="button" aria-label="รูปถัดไป">&gt;</button>
            </div>

        </section>

        <section class="Application" id="Application">
            <h1 class="section-heading">Application</h1>


            <div class="SlideShow">
                <div class="SlideShow__content">
                    <a href="https://www.facebook.com/" target="_blank" rel="another tab">
                        <img class="SlideShow__img" src="facebook.png" alt="Facebook">
                    </a>

                    <a href="https://www.instagram.com/" target="_blank" rel="another tab">
                        <img class="SlideShow__img" src="Instagram.png" alt="Instagram">
                    </a>

                    <a href="https://www.messenger.com/" target="_blank" rel="another tab">
                        <img class="SlideShow__img" src="Messenger.png" alt="Messenger">
                    </a>

                    <a href="https://www.threads.com/" target="_blank" rel="another tab">
                        <img class="SlideShow__img" src="Threads.png" alt="Threads">
                    </a>
                </div>
                <div class="SlideShow__controls">
                    <button class="slide-prev" type="button" aria-label="รูปก่อนหน้า">&lt;</button>
                    <span class="Dots">
                        <span class="SlideShow__dot"></span>
                        <span class="SlideShow__dot"></span>
                        <span class="SlideShow__dot"></span>
                        <span class="SlideShow__dot"></span>
                    </span>
                    <button class="slide-next" type="button" aria-label="รูปถัดไป">&gt;</button>
                </div>
            </div>
        </section>

        <section class="Stock" id="Stock">
            <h1 class="section-stock">Stock</h1>
            <div>
                <div class="StockRange">
                    <button type="button" data-range="1D">Day</button>
                    <button type="button" data-range="1W">Week</button>
                    <button type="button" data-range="1M">Month</button>
                    <button type="button" data-range="1Y">Year</button>
                </div>

                <p id="stock-status"></p>
                <div id="tooltip"></div>
                <canvas id="meta-chart" width="800" height="400"></canvas>
            </div>
        </section>

        
        <section id="Production">
            <h1 class="section-prod">Production</h1>

            <div class="Production">
                <a href="">
                    <img class="prod" src="Meta_Quest.jpg" alt="meta-quest">

                </a>
                <a href="">
                    <img class="prod" src="oakley_meta.png" alt="oakley-meta">
                </a>
                <a href="">
                    <img class="prod" src="rayban-meta.jpg" alt="rayban-meta">
                </a>
            </div>
        </section>
    </main>
</body>

</html>
