<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <script src="dir/account.js" defer></script>
</head>

<body id="Account-Page">
    <header class="account-header">
        <a href="/" style="text-decoration: none; color: #000000;">← Back to home</a>
    </header>

    <main id="account-container">
        <h1>My Account</h1>
        <section>
            <form id="profile-form">
                <label for="account-name">Name</label>
                <input id="account-name" name="name" type="text" required>

                <label for="account-email">Email</label>
                <input id="account-email" type="email" readonly>

                <fieldset>
                    <legend>Password</legend>
                    <label class="password-option">
                        <input id="account-password" type="radio" name="ChangePassword" value="no" checked>
                        <span>Keep current password</span>
                    </label>
                    <label class="password-option">
                        <input id="change-password" type="radio" name="ChangePassword" value="yes">
                        <span>Change password</span>
                    </label>
                </fieldset>
                <div id="password-fields" hidden>
                    <label for="account-current-password">Current Password</label>
                    <input id="account-current-password" type="password" autocomplete="current-password">

                    <label for="account-new-password">New Password</label>
                    <input id="account-new-password" type="password" autocomplete="new-password" minlength="8">

                    <label for="account-confirm-password">Confirm New Password</label>
                    <input id="account-confirm-password" type="password" autocomplete="new-password" minlength="8">
                </div>
                <button type="submit">Save changes</button>
            </form>
        </section>

    </main>
</body>

</html>
