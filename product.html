<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="dir/product.js" defer></script>
    <title>Product Details</title>
</head>

<body class="product-page">
    <header class="product-header">
        <a class="product-brand" href="/">Meta<span>Collection</span></a>
        <a class="product-back" href="/#Production"><span aria-hidden="true">←</span> All products</a>
    </header>
    <main class="product-card">
        <div class="product-visual">
            <img id="product-image" alt="" hidden>
        </div>

        <div class="product-info">
            <h1 id="product-title"></h1>
            <div class="product-divider" aria-hidden="true"></div>
            <p id="product-description"></p>
            <a class="product-explore" href="/#Production">Explore more products <span aria-hidden="true">↗</span></a>
        </div>
    </main>
    
</body>

</html>
